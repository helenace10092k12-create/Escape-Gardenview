<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>Escape Gardenview - Mario Parkour Demo</title>
    <style>
        * { box-sizing: border-box; margin: 0; padding: 0; user-select: none; }
        body {
            background-color: #020105;
            color: #fff;
            font-family: 'Courier New', Courier, monospace;
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
            overflow: hidden;
        }
        #game-box {
            position: relative;
            width: 800px;
            height: 600px;
            background: #000;
            border: 4px solid #512da8;
            box-shadow: 0 0 35px rgba(81, 45, 168, 0.8);
            display: flex;
            flex-direction: column;
        }
        #top-ui {
            height: 40px; background: #0b0514; border-bottom: 2px solid #512da8;
            display: flex; justify-content: space-between; align-items: center; padding: 0 12px; z-index: 20;
        }
        .title { color: #ff7043; font-weight: bold; font-size: 11px; letter-spacing: 1px; }
        .hud-right { display: flex; gap: 8px; align-items: center; }
        .hud-group { display: flex; gap: 4px; align-items: center; font-size: 10px; }
        .toon-btn {
            background: #1a0b2e; color: #d1c4e9; border: 1px solid #7c4dff;
            padding: 3px 6px; font-size: 10px; cursor: pointer; border-radius: 3px;
        }
        .toon-btn.active { background: #651fff; color: #fff; font-weight: bold; }
        .lang-btn {
            background: #311b92; color: #ffeb3b; border: 1px solid #ab47bc;
            padding: 3px 8px; font-size: 10px; cursor: pointer; border-radius: 4px; font-weight: bold;
        }

        #canvas-container {
            position: relative; width: 800px; height: 560px; background: #05020a; overflow: hidden;
        }
        canvas { display: block; width: 100%; height: 100%; image-rendering: pixelated; }

        /* BẢNG KỸ NĂNG HIỆN 10 GIÂY */
        #skill-popup {
            position: absolute; top: 55px; left: 50%; transform: translateX(-50%);
            background: rgba(26, 11, 46, 0.95); border: 2px solid #00e676; border-radius: 6px;
            padding: 8px 16px; font-size: 11px; color: #00e676; z-index: 50; display: none; text-align: center;
            box-shadow: 0 0 15px rgba(0, 230, 118, 0.4);
        }

        /* MENU MỞ ĐẦU */
        #menu-screen {
            position: absolute; top: 0; left: 0; width: 100%; height: 100%;
            background: radial-gradient(circle, #1a0b2e 0%, #030105 100%);
            display: flex; flex-direction: column; justify-content: center; align-items: center; z-index: 100;
        }
        .menu-title { font-size: 28px; color: #ff7043; font-weight: bold; margin-bottom: 30px; text-shadow: 0 0 10px #ff7043; }
        .menu-btn {
            background: #311b92; color: #ffeb3b; border: 2px solid #ab47bc; padding: 10px 30px;
            font-size: 14px; font-weight: bold; cursor: pointer; border-radius: 6px; margin: 6px; width: 240px; text-align: center;
        }
        .menu-btn:hover { background: #512da8; color: #fff; box-shadow: 0 0 15px #7c4dff; }

        /* BẢNG VEEMAIL XANH */
        #veemail-modal {
            position: absolute; top: 50%; left: 50%; transform: translate(-50%, -50%);
            width: 620px; height: 400px; background: rgba(10, 25, 15, 0.95); border: 4px solid #00e676;
            border-radius: 10px; padding: 20px; z-index: 200; display: none; flex-direction: column; justify-content: space-between;
            box-shadow: 0 0 30px rgba(0, 230, 118, 0.5);
        }
        .veemail-header { display: flex; justify-content: space-between; align-items: center; border-bottom: 2px solid #00e676; padding-bottom: 8px; }
        .veemail-title { color: #00e676; font-weight: bold; font-size: 13px; }
        .close-x { background: #ff1744; color: #fff; border: none; width: 24px; height: 24px; font-weight: bold; cursor: pointer; border-radius: 4px; }
        .veemail-body { color: #b9f6ca; font-size: 11px; line-height: 1.5; overflow-y: auto; max-height: 280px; }

        /* HỘP THOẠI */
        #dialogue-box {
            position: absolute; bottom: 20px; left: 50%; transform: translateX(-50%);
            width: 720px; height: 110px; background: rgba(8, 3, 18, 0.95); border: 3px solid #7c4dff;
            border-radius: 8px; padding: 10px 16px; z-index: 90; display: none; flex-direction: column; justify-content: space-between;
        }
        #speaker-name { color: #ffb74d; font-weight: bold; font-size: 12px; }
        #dialogue-text { color: #00e676; font-size: 12px; line-height: 1.3; }
        .action-btn { background: #311b92; color: #ffeb3b; border: 2px solid #ab47bc; padding: 4px 12px; font-size: 10px; cursor: pointer; border-radius: 4px; font-weight: bold; align-self: flex-end; }
    </style>
</head>
<body>

<div id="game-box">
    <div id="top-ui">
        <div class="title" id="ui-gametitle">GARDENVIEW: HALLOWEEN ESCAPE</div>
        <div class="hud-right">
            <div class="hud-group">
                <button class="toon-btn" id="btn-yatta" onclick="switchChar('yatta')">[1] Yatta</button>
                <button class="toon-btn" id="btn-looey" onclick="switchChar('looey')">[2] Looey</button>
                <button class="toon-btn" id="btn-blot" onclick="switchChar('blot')">[3] Blot</button>
                <button class="toon-btn active" id="btn-trio" onclick="switchChar('trio')">[4] Trio</button>
                <span style="color:#ffeb3b; margin-left: 6px;" id="hud-keys">🔑 Keys: 0/8</span>
            </div>
            <button class="lang-btn" id="lang-btn" onclick="toggleLanguage()">VIE / ENG</button>
        </div>
    </div>

    <div id="canvas-container">
        <canvas id="gameCanvas" width="800" height="560"></canvas>
        <div id="skill-popup"></div>
    </div>

    <!-- MENU CHÍNH -->
    <div id="menu-screen">
        <div class="menu-title" id="menu-main-title">ESCAPE GARDENVIEW</div>
        <button class="menu-btn" id="btn-play" onclick="startGame()">PLAY / NEW GAME</button>
        <button class="menu-btn" id="btn-cont" onclick="startGame()">CONTINUE</button>
        <button class="menu-btn" id="btn-how" onclick="showHelp()">HOW TO PLAY</button>
        <button class="menu-btn" id="btn-exit" style="border-color:#ff1744; color:#ff8a80;" onclick="alert('Exiting game...')">EXIT</button>
    </div>

    <!-- BẢNG VEEMAIL XANH -->
    <div id="veemail-modal">
        <div class="veemail-header">
            <span class="veemail-title" id="v-title">🖥️ VEEMAIL SYSTEM - INCOMING MESSAGE</span>
            <button class="close-x" onclick="closeVeemail()">X</button>
        </div>
        <div class="veemail-body" id="v-content">
            Welcome to Gardenview! Collect 8 golden keys, enter random rooms [E] to loot items, and watch out for Twisted monsters chasing you!<br><br>
            <i>Signed: D</i>
        </div>
    </div>

    <!-- HỘP THOẠI -->
    <div id="dialogue-box">
        <div>
            <div id="speaker-name">NARRATOR</div>
            <div id="dialogue-text">...</div>
        </div>
        <button class="action-btn" id="next-btn" onclick="nextDialogue()">Next [Space] ></button>
    </div>
</div>

<script>
const canvas = document.getElementById('gameCanvas');
const ctx = canvas.getContext('2d');

let currentLang = 'ENG';
let gameState = 'MENU';
let dialogueStep = 0;
let activeChar = 'trio'; // MẶC ĐỊNH LÀ TRIO
let cameraX = 0;
let skillTimer = null;

let player = { worldX: 100, y: 450, vx: 0, vy: 0, grounded: true, hp: 3 };

// HỆ THỐNG PARKOUR (BỤC NHẢY MARIO), CỬA PHÒNG NGẪU NHIÊN & QUÁI (TWISTED)
let platforms = [
    { x: 300, y: 380, w: 100, h: 20 },
    { x: 500, y: 320, w: 120, h: 20 },
    { x: 700, y: 260, w: 100, h: 20 },
    { x: 950, y: 350, w: 140, h: 20 },
    { x: 1200, y: 300, w: 120, h: 20 }
];

let doors = [
    { worldX: 450, y: 370, active: true },
    { worldX: 850, y: 370, active: true },
    { worldX: 1350, y: 370, active: true }
];

let twisted = { worldX: -200, y: 450, speed: 2, active: false };
let keysCount = 0;

const keysInput = { left: false, right: false };

const texts = {
    ENG: {
        title: "GARDENVIEW: HALLOWEEN ESCAPE",
        play: "PLAY / NEW GAME", cont: "CONTINUE", how: "HOW TO PLAY", exit: "EXIT",
        next: "Next [Space] >", pressE: "Press [E] to Enter Door / Loot",
        vTitle: "🖥️ VEEMAIL SYSTEM - INCOMING MESSAGE",
        skills: {
            trio: "🎪 CIRCUS TRIO: All members move together in harmony!",
            yatta: "🤸 YATTA (Acrobatic): Can swing on rings and walk on tightropes!",
            looey: "🎈 LOOEY (Clown): Creates balloon animals to distract Twisted!",
            blot: "🖤 BLOT (Mime): Turns into Ichor puddle, speaks backwards!"
        },
        intro: [
            { speaker: "NARRATOR", text: "The show has concluded. Circus Trio chats happily as they head toward the dressing room." },
            { speaker: "YATTA", text: "Whew... that was a blast today! The Toon crowd was so energetic." },
            { speaker: "LOOEY", text: "My balloons almost popped right at the finale! Haha!" },
            { speaker: "BLOT", text: "!tolB m'I, iH (Hi, I'm Blot! - Smiles gently)." },
            { speaker: "SYSTEM", text: "Objective: Move near the dressing room door on the left and press [E]." }
        ],
        blackout: [
            { speaker: "NARRATOR", text: "* SLAM! * The dressing room door shuts on its own! BZZZZT... Total blackout!" },
            { speaker: "YATTA", text: "Eek! Who closed the door?! Why is it pitch black?!" },
            { speaker: "LOOEY", text: "Wait, look! A strange rainbow-glowing virtual button is right in front of us!" },
            { speaker: "BLOT", text: "!thgil eht evah ew woh ,ohO (Oho, how do we have light?)" },
            { speaker: "SYSTEM", text: "Curiously, Yatta presses the button... A portal opens and sucks everyone in!" }
        ]
    },
    VIE: {
        title: "GARDENVIEW: TRỐN THOÁT HALLOWEEN",
        play: "CHƠI MỚI / BẮT ĐẦU", cont: "CHƠI TIẾP", how: "HƯỚNG DẪN", exit: "THOÁT",
        next: "Tiếp tục [Space] >", pressE: "Nhấn [E] để vào phòng / lục lọi",
        vTitle: "🖥️ HỆ THỐNG VEEMAIL - TIN NHẮN MỚI",
        skills: {
            trio: "🎪 CIRCUS TRIO: Cả ba thành viên cùng di chuyển đồng bộ!",
            yatta: "🤸 YATTA (Acrobatic): Đu vòng, đi trên dây né đòn khéo léo!",
            looey: "🎈 LOOEY (Clown): Tạo bóng bay đánh lạc hướng Twisted!",
            blot: "🖤 BLOT (Mime): Biến thành vũng Ichor, nói ngược độc đáo!"
        },
        intro: [
            { speaker: "DẪN CHUYỆN", text: "Buổi biểu diễn kết thúc. Circus Trio rôm rả trò chuyện bước về phía phòng thay đồ." },
            { speaker: "YATTA", text: "Phù... hôm nay quẩy sung thật đấy! Mấy bạn Toon cổ vũ nhiệt tình ghê." },
            { speaker: "LOOEY", text: "Bóng bay của tui suýt nổ tung lúc cuối màn diễn! Haha!" },
            { speaker: "BLOT", text: "!tolB m'I, iH (Hi, I'm Blot! - Vừa nói vừa mỉm cười nhẹ)." },
            { speaker: "HỆ THỐNG", text: "Nhiệm vụ: Di chuyển lại gần cửa phòng thay đồ bên trái và nhấn [E]." }
        ],
        blackout: [
            { speaker: "DẪN CHUYỆN", text: "* RẦM! * Cánh cửa phòng thay đồ tự động đóng sầm lại! BZZZZT... Mất điện toàn tập!" },
            { speaker: "YATTA", text: "Á! Ai đóng cửa lại vậy?! Sao tự nhiên tối thui thế này?!" },
            { speaker: "LOOEY", text: "Khoan đã, nhìn kìa! Có một nút bấm ảo màu cầu vồng đang phát sáng kìa!" },
            { speaker: "BLOT", text: "!thgil eht evah ew woh ,ohO (Oho, sao lại có ánh sáng thế này?)" },
            { speaker: "HỆ THỐNG", text: "Vì tò mò, Yatta bấm vào nút ảo... Một cánh cổng hút cả nhóm vào trong!" }
        ]
    }
};

function toggleLanguage() {
    currentLang = currentLang === 'ENG' ? 'VIE' : 'ENG';
    document.getElementById('lang-btn').innerText = currentLang === 'ENG' ? 'VIE / ENG' : 'ENG / VIE';
    updateUIText();
}

function updateUIText() {
    let t = texts[currentLang];
    document.getElementById('ui-gametitle').innerText = t.title;
    document.getElementById('menu-main-title').innerText = t.title;
    document.getElementById('btn-play').innerText = t.play;
    document.getElementById('btn-cont').innerText = t.cont;
    document.getElementById('btn-how').innerText = t.how;
    document.getElementById('btn-exit').innerText = t.exit;
    document.getElementById('next-btn').innerText = t.next;
    document.getElementById('v-title').innerText = t.vTitle;
    if (gameState === 'COMIC' || gameState === 'BLACKOUT') updateDialogue();
}

function showHelp() {
    alert(currentLang === 'ENG' ? "Controls: A/D to Move, W/Up to Jump/Parkour, E to Enter Doors, 1/2/3/4 to Switch Characters!" : "Điều khiển: A/D di chuyển, W/Lên nhảy parkour, E vào phòng, 1/2/3/4 đổi nhân vật!");
}

function startGame() {
    document.getElementById('menu-screen').style.display = 'none';
    gameState = 'COMIC';
    dialogueStep = 0;
    document.getElementById('dialogue-box').style.display = 'flex';
    updateDialogue();
}

function nextDialogue() {
    dialogueStep++;
    let t = texts[currentLang];
    if (gameState === 'COMIC') {
        if (dialogueStep < t.intro.length) updateDialogue();
        else { document.getElementById('dialogue-box').style.display = 'none'; gameState = 'HALLWAY'; }
    } else if (gameState === 'BLACKOUT') {
        if (dialogueStep < t.blackout.length) updateDialogue();
        else {
            document.getElementById('dialogue-box').style.display = 'none';
            gameState = 'PORTAL';
            setTimeout(() => { gameState = 'VEEMAIL_OPEN'; document.getElementById('veemail-modal').style.display = 'flex'; }, 2000);
        }
    }
}

function updateDialogue() {
    let t = texts[currentLang];
    let script = (gameState === 'COMIC') ? t.intro : t.blackout;
    let data = script[dialogueStep];
    document.getElementById('speaker-name').innerText = data.speaker;
    document.getElementById('dialogue-text').innerText = data.text;
}

function closeVeemail() {
    document.getElementById('veemail-modal').style.display = 'none';
    gameState = 'SIDE_SCROLL';
    // Kích hoạt quái Twisted rượt đuổi sau khi đóng Veemail
    setTimeout(() => { twisted.active = true; twisted.worldX = player.worldX - 600; }, 3000);
}

function switchChar(c) {
    activeChar = c;
    document.querySelectorAll('.toon-btn').forEach(b => b.classList.remove('active'));
    document.getElementById(c === 'yatta' ? 'btn-yatta' : c === 'looey' ? 'btn-looey' : c === 'blot' ? 'btn-blot' : 'btn-trio').classList.add('active');

    let popup = document.getElementById('skill-popup');
    popup.innerText = texts[currentLang].skills[c];
    popup.style.display = 'block';

    if (skillTimer) clearTimeout(skillTimer);
    skillTimer = setTimeout(() => { popup.style.display = 'none'; }, 10000);
}

// PHÍM BẤM
window.addEventListener('keydown', (e) => {
    if (e.code === 'Space' && (gameState === 'COMIC' || gameState === 'BLACKOUT')) nextDialogue();
    if (e.code === 'Digit1') switchChar('yatta');
    if (e.code === 'Digit2') switchChar('looey');
    if (e.code === 'Digit3') switchChar('blot');
    if (e.code === 'Digit4') switchChar('trio');

    if (e.code === 'KeyA' || e.code === 'ArrowLeft') keysInput.left = true;
    if (e.code === 'KeyD' || e.code === 'ArrowRight') keysInput.right = true;

    if (e.code === 'KeyW' || e.code === 'ArrowUp') {
        if (player.grounded) { player.vy = -11; player.grounded = false; }
    }

    if (e.code === 'KeyE') {
        if (gameState === 'HALLWAY' && player.worldX < 150) {
            gameState = 'BLACKOUT'; dialogueStep = 0;
            document.getElementById('dialogue-box').style.display = 'flex'; updateDialogue();
        }
        // Tương tác cửa phòng ngẫu nhiên
        doors.forEach(d => {
            if (gameState === 'SIDE_SCROLL' && d.active && Math.abs(player.worldX - d.worldX) < 35) {
                keysCount++;
                d.active = false;
                document.getElementById('hud-keys').innerText = "🔑 Keys: " + keysCount + "/8";
                alert(currentLang === 'ENG' ? "Entered room! Looted 1 Golden Key!" : "Đã vào phòng lục lọi! Nhận được 1 Chìa Khóa Vàng!");
            }
        });
    }
});

window.addEventListener('keyup', (e) => {
    if (e.code === 'KeyA' || e.code === 'ArrowLeft') keysInput.left = false;
    if (e.code === 'KeyD' || e.code === 'ArrowRight') keysInput.right = false;
});

// GAME LOOP & VẬT LÝ PARKOUR
function gameLoop() {
    ctx.clearRect(0, 0, 800, 560);

    if (gameState === 'HALLWAY' || gameState === 'SIDE_SCROLL') {
        let moveX = 0;
        if (keysInput.left) moveX = -4.5;
        if (keysInput.right) moveX = 4.5;

        player.worldX += moveX;
        player.vy += 0.45; // Trọng lực
        player.y += player.vy;

        // Va chạm sàn chính
        if (player.y >= 450) { player.y = 450; player.vy = 0; player.grounded = true; }

        // Va chạm bục Parkour (Mario style)
        platforms.forEach(plat => {
            if (player.worldX + 15 > plat.x && player.worldX - 15 < plat.x + plat.w) {
                if (player.y >= plat.y && player.y - player.vy <= plat.y && player.vy > 0) {
                    player.y = plat.y; player.vy = 0; player.grounded = true;
                }
            }
        });

        if (player.worldX < 20) player.worldX = 20;
        if (player.worldX > 1800) player.worldX = 1800;

        // Twisted rượt đuổi
        if (twisted.active) {
            twisted.worldX += twisted.speed;
            if (Math.abs(player.worldX - twisted.worldX) < 30) {
                alert(currentLang === 'ENG' ? "Caught by Twisted! Careful!" : "Bị Twisted bắt gặp! Cẩn thận!");
                player.worldX -= 150; // Bị đẩy lùi
            }
        }

        // Camera cuộn cảnh theo nhân vật
        cameraX = player.worldX - 350;
        if (cameraX < 0) cameraX = 0;
        if (cameraX > 1000) cameraX = 1000;

        ctx.save();
        ctx.translate(-cameraX, 0);

        if (gameState === 'HALLWAY') {
            ctx.fillStyle = '#06030c'; ctx.fillRect(0, 0, 1800, 560);
            ctx.fillStyle = '#311b92'; ctx.fillRect(50, 300, 60, 1
